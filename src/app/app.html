<div class="app-wrapper" [class.dark-theme]="isDarkMode">
  <div class="theme-panel">
    <div class="color-picker-group">
      <label for="accentColor">Énfasis:</label>
      <input type="color" id="accentColor" [value]="accentColor" (input)="changeAccentColor($event)">
    </div>
    <button type="button" class="btn-theme" (click)="toggleDarkMode()">
      {{ isDarkMode ? '☀️ Modo Claro' : '🌙 Modo Noche' }}
    </button>
  </div>

  <div class="container">
    <h1>Informe de Cantera — Afirmado</h1>
    <app-informe-form></app-informe-form>
  </div>
</div>
