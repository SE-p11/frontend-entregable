<div class="app-wrapper" [class.dark-theme]="isDarkMode">
  <!-- Panel Flotante -->
  <div class="theme-panel">
    <div class="color-picker-group">
      <label for="accentColor">Énfasis:</label>
      <input
        type="color"
        id="accentColor"
        [value]="accentColor"
        (input)="changeAccentColor($event)">
    </div>

    <button type="button" class="btn-theme" (click)="toggleDarkMode()">
      {{ isDarkMode ? '☀️ Modo Claro' : '🌙 Modo Noche' }}
    </button>
  </div>

  <!-- Tarjeta Principal -->
  <div class="container">
    <h1>Combinador de Archivos PDF e Imágenes</h1>
    <p class="subtitle">Selecciona, gestiona y reordena tus archivos antes de unificarlos</p>

    <div class="upload-section">
      <input
        type="file"
        id="fileInput"
        class="file-input"
        (change)="onFileSelected($event)"
        multiple
        accept=".pdf, .docx, .doc, .xlsx, .xls, image/*">
      <label for="fileInput" class="upload-label">
        <span class="upload-icon">📄</span>
        <span>Haz clic aquí para seleccionar PDFs, Word, Excel o Imágenes</span>
      </label>
    </div>

    <div class="file-list" *ngIf="selectedFiles.length > 0">
      <div class="file-item" *ngFor="let item of selectedFiles; let i = index">
        <div class="file-info">
          <span class="file-name">{{ item.file.name }}</span>
          <span class="file-size">{{ getFormattedSize(item.file.size) }}</span>
        </div>
        <div class="file-actions">
          <button class="btn-icon" (click)="moveFile(i, 'up')" [disabled]="i === 0">⬆️</button>
          <button class="btn-icon" (click)="moveFile(i, 'down')" [disabled]="i === selectedFiles.length - 1">⬇️</button>
          <button class="btn-icon delete" (click)="removeFile(item.id)">🗑️</button>
        </div>
      </div>
    </div>

    <button
      class="btn-primary"
      (click)="combineAndDownload()"
      [disabled]="selectedFiles.length === 0 || isProcessing">
      {{ isProcessing ? '⏳ Unificando documentos...' : '⚡ Unir y Descargar PDF' }}
    </button>
  </div>
</div>
